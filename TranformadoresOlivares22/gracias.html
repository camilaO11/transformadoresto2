<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Mensaje Enviado!</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .box {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            max-width: 400px;
        }
        h1 { color: #00a651; margin-bottom: 10px; }
        p { color: #555; margin-bottom: 25px; }
        a {
            display: inline-block;
            background: #00a651;
            color: white;
            text-decoration: none;
            padding: 12px 30px;
            border-radius: 50px;
            font-weight: 600;
            transition: 0.3s;
        }
        a:hover { background: #008540; }
    </style>
</head>
<body>
    <div class="box">
        <h1>¡Muchas Gracias!</h1>
        <p>Tu mensaje ha sido enviado con éxito. Nos pondremos en contacto contigo a la brevedad.</p>
        <a href="index.html">Volver al Inicio</a>
    </div>

<div id='ia-sdk-root'></div>
<script src='https://storage.googleapis.com/ia-lt-sdk/prod/ia-sdk.umd.js'></script>
<script>

if (window.innerWidth >= 1024) {
    window.iaSdk.init({
      data: { pk:'8bbdda571289ebee249aa5a41e222d7e' },
      config: {
        style: {
          "zIndex": 999999,
          "bottom": "20px",
          "left": "20px"
        }
      },
    });

    const hideGreetingPopUp = setInterval(() => {
    
      const elements = document.querySelectorAll('#ia-sdk-root *');
      elements.forEach(el => {
        if (el.textContent.includes('ayudarte') || el.textContent.includes('Hola')) {
          
          const popUpContainer = el.closest('div');
          if (popUpContainer && popUpContainer !== document.getElementById('ia-sdk-root')) {
            popUpContainer.style.display = 'none';
          }
        }
      });
    }, 500);

    setTimeout(() => clearInterval(hideGreetingPopUp), 10000);

  } else {

    document.getElementById('ia-sdk-root').innerHTML = '';
  }
</script>
</body>
</html>
